name: Bing Rewards Daily Automation

on:
  schedule:
    # Lần 1 - Flow 1: 00:30 AM (Giờ Việt Nam, UTC+7 -> 17:30 UTC hôm trước) - Account 1, 2, 3
    - cron: '30 17 * * *'
    # Lần 1 - Flow 2: 03:30 AM (Giờ Việt Nam, UTC+7 -> 20:30 UTC hôm trước) - Account 4, 5, 6
    - cron: '30 20 * * *'
    # Lần 2 - Flow 1: 12:30 PM (Giờ Việt Nam, UTC+7 -> 05:30 UTC) - Account 1, 2, 3
    - cron: '30 5 * * *'
    # Lần 2 - Flow 2: 15:30 PM (Giờ Việt Nam, UTC+7 -> 08:30 UTC) - Account 4, 5, 6
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      target_account:
        description: '🎯 Chọn tài khoản muốn chạy (hoặc All để chạy tất cả)'
        required: true
        default: 'All'
        type: choice
        options:
          - 'All'
          - 'Account 1'
          - 'Account 2'
          - 'Account 3'
          - 'Account 4'
          - 'Account 5'
          - 'Account 6'
      flow:
        description: '📦 Chọn flow muốn chạy'
        required: false
        default: 'All'
        type: choice
        options:
          - 'All'
          - 'Flow 1 (Account 1,2,3)'
          - 'Flow 2 (Account 4,5,6)'

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Flow 1: Account 1, 2, 3
  flow-1:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: >-
      ${{
        github.event.inputs.flow == 'All' ||
        github.event.inputs.flow == 'Flow 1 (Account 1,2,3)' ||
        github.event_name == 'schedule' && (github.event.schedule == '30 17 * * *' || github.event.schedule == '30 5 * * *') ||
        github.event_name == 'workflow_dispatch' && github.event.inputs.flow == ''
      }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Flow 1 (Account 1, 2, 3)
        env:
          TZ: 'Asia/Ho_Chi_Minh'
          MICROSOFT_SESSION: ${{ secrets.MICROSOFT_SESSION }}
          MICROSOFT_SESSION_1: ${{ secrets.MICROSOFT_SESSION_1 }}
          MICROSOFT_SESSION_2: ${{ secrets.MICROSOFT_SESSION_2 }}
          MICROSOFT_SESSION_3: ${{ secrets.MICROSOFT_SESSION_3 }}
          MICROSOFT_SESSION_4: ${{ secrets.MICROSOFT_SESSION_4 }}
          MICROSOFT_SESSION_5: ${{ secrets.MICROSOFT_SESSION_5 }}
          MICROSOFT_SESSION_6: ${{ secrets.MICROSOFT_SESSION_6 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --all --headless --account "Account 1"
          python main.py --all --headless --account "Account 2"
          python main.py --all --headless --account "Account 3"

      - name: Commit and Push Dashboard History
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          python -c "from src.reporter import AccountReporter; AccountReporter.generate_html_dashboard()"
          git add data/accounts_history.json dashboard.html index.html
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "chore(stats): update rewards dashboard and accounts history [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X ours origin main && git push origin main && break || sleep 5
            done
          }

  # Flow 2: Account 4, 5, 6
  flow-2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: >-
      ${{
        github.event.inputs.flow == 'All' ||
        github.event.inputs.flow == 'Flow 2 (Account 4,5,6)' ||
        github.event_name == 'schedule' && (github.event.schedule == '30 20 * * *' || github.event.schedule == '30 8 * * *') ||
        github.event_name == 'workflow_dispatch' && github.event.inputs.flow == ''
      }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Flow 2 (Account 4, 5, 6)
        env:
          TZ: 'Asia/Ho_Chi_Minh'
          MICROSOFT_SESSION: ${{ secrets.MICROSOFT_SESSION }}
          MICROSOFT_SESSION_1: ${{ secrets.MICROSOFT_SESSION_1 }}
          MICROSOFT_SESSION_2: ${{ secrets.MICROSOFT_SESSION_2 }}
          MICROSOFT_SESSION_3: ${{ secrets.MICROSOFT_SESSION_3 }}
          MICROSOFT_SESSION_4: ${{ secrets.MICROSOFT_SESSION_4 }}
          MICROSOFT_SESSION_5: ${{ secrets.MICROSOFT_SESSION_5 }}
          MICROSOFT_SESSION_6: ${{ secrets.MICROSOFT_SESSION_6 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --all --headless --account "Account 4"
          python main.py --all --headless --account "Account 5"
          python main.py --all --headless --account "Account 6"

      - name: Commit and Push Dashboard History
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          python -c "from src.reporter import AccountReporter; AccountReporter.generate_html_dashboard()"
          git add data/accounts_history.json dashboard.html index.html
          git diff --quiet && git diff --staged --quiet || {
            git commit -m "chore(stats): update rewards dashboard and accounts history [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X ours origin main && git push origin main && break || sleep 5
            done
          }

