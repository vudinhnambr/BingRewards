name: Bing Rewards Daily Automation

on:
  schedule:
    # Chạy vào 07:45 AM (giờ Việt Nam, UTC+7), tức 00:45 AM UTC
    - cron: '45 0 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Bing Rewards Bot
        env:
          MICROSOFT_SESSION: ${{ secrets.MICROSOFT_SESSION }}
          MICROSOFT_SESSION_1: ${{ secrets.MICROSOFT_SESSION_1 }}
          MICROSOFT_SESSION_2: ${{ secrets.MICROSOFT_SESSION_2 }}
          MICROSOFT_SESSION_3: ${{ secrets.MICROSOFT_SESSION_3 }}
          MICROSOFT_SESSION_4: ${{ secrets.MICROSOFT_SESSION_4 }}
          MICROSOFT_SESSION_5: ${{ secrets.MICROSOFT_SESSION_5 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --all --headless

      - name: Commit and Push Dashboard History
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/accounts_history.json dashboard.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(stats): update rewards dashboard and accounts history [skip ci]" && git push)

