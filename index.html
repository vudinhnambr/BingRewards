<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Tổng Quan Microsoft Rewards</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js & DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b 0%, #0b0f19 50%, #030712 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 0.85rem 0.65rem 2.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--card-border);
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            line-height: 1.2;
        }

        .header-title p {
            color: var(--text-muted);
            margin-top: 0.15rem;
            font-size: 0.75rem;
        }

        .btn-refresh {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 0.45rem 0.8rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3);
            transition: transform 0.15s ease;
        }

        .btn-refresh:active {
            transform: scale(0.95);
        }

        /* Stats 2x2 Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.75rem;
            }
            body {
                padding: 1.5rem 1.25rem 3rem;
            }
            .header-title h1 {
                font-size: 1.6rem;
            }
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 0.75rem;
            padding: 0.75rem 0.85rem;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2.5px;
        }

        .stat-card.c-blue::before { background: linear-gradient(90deg, #38bdf8, #3b82f6); }
        .stat-card.c-green::before { background: linear-gradient(90deg, #34d399, #10b981); }
        .stat-card.c-purple::before { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }
        .stat-card.c-yellow::before { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0.25rem 0 0.1rem;
            letter-spacing: -0.02em;
        }

        .stat-sub {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        /* Section Headings */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.65rem;
            gap: 0.5rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        /* Compact Account List (Collapsible / Minimized by Default) */
        .accounts-list {
            display: none;
            flex-direction: column;
            gap: 0.45rem;
            margin-bottom: 1.25rem;
        }

        .accounts-list.open {
            display: flex;
        }

        @media (min-width: 640px) {
            .accounts-list.open {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0.65rem;
            }
        }

        .account-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 0.65rem;
            padding: 0.65rem 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .acc-main-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .acc-name {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .acc-meta {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .acc-points-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .acc-pts-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.05rem;
        }

        .acc-pts-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1.1;
        }

        .acc-gained-val {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-green);
            line-height: 1.1;
        }

        .status-tag {
            padding: 0.15rem 0.45rem;
            border-radius: 0.35rem;
            font-size: 0.68rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-tag.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-tag.wait {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-yellow);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-tag.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Panel Container */
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 0.75rem;
            padding: 0.85rem;
            margin-bottom: 1.25rem;
        }

        @media (min-width: 640px) {
            .panel {
                padding: 1.15rem;
            }
        }

        .chart-wrapper {
            display: none;
        }

        .chart-wrapper.open {
            display: block;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .chart-container {
                height: 250px;
            }
        }

        .chart-tabs {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.65rem;
            margin-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.45rem;
            overflow-x: auto;
        }

        .chart-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.76rem;
            font-weight: 600;
            padding: 0.35rem 0.65rem;
            border-radius: 0.45rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .chart-tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .chart-tab-btn.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.3);
            font-weight: 700;
        }

        /* History Accordion */
        .btn-toggle-all {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 0.2rem 0.55rem;
            border-radius: 0.35rem;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
        }

        .day-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 0.65rem;
            margin-bottom: 0.5rem;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.65rem 0.85rem;
            cursor: pointer;
            background: rgba(30, 41, 59, 0.4);
            user-select: none;
            gap: 0.4rem;
        }

        .day-header:active {
            background: rgba(30, 41, 59, 0.8);
        }

        .day-title {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .day-badges {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .badge-pill {
            font-size: 0.68rem;
            padding: 0.12rem 0.45rem;
            border-radius: 9999px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-gained {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-runs {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-today {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            font-size: 0.62rem;
            padding: 0.1rem 0.35rem;
            border-radius: 0.25rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .chevron {
            transition: transform 0.2s ease;
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .day-card.open .chevron {
            transform: rotate(180deg);
        }

        .day-content {
            display: none;
            padding: 0.2rem 0.4rem 0.4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .day-card.open .day-content {
            display: block;
        }

        /* Pixel-Locked History Grid Rows */
        .run-grid-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 68px 80px;
            align-items: center;
            padding: 0.5rem 0.35rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 0.35rem;
        }

        .run-grid-row:last-child {
            border-bottom: none;
        }

        .run-col-acc {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            min-width: 0;
        }

        .run-col-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .run-col-time {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .run-col-pts {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.05rem;
            text-align: right;
        }

        .run-col-pts-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: #38bdf8;
            line-height: 1.1;
        }

        .run-col-gained {
            font-size: 0.7rem;
            font-weight: 700;
            color: #34d399;
            line-height: 1.1;
        }

        .run-col-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.1rem;
        }

        .run-col-pill {
            padding: 0.12rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
            line-height: 1.2;
        }

        .run-col-streak {
            font-size: 0.65rem;
            color: var(--text-muted);
            line-height: 1.1;
        }
    </style>
</head>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <h1>💎 MS Rewards</h1>
                <p>Theo dõi điểm thưởng & chuỗi tự động</p>

                    Làm mới
                </button>
            </div>
        </div>

        <!-- Stats 2x2 Grid -->
        <div class="stats-grid">
            <div class="stat-card c-blue">
                <div class="stat-label">Tổng Điểm</div>
                <div class="stat-value">11,866</div>
                <div class="stat-sub">💎 Tích lũy khả dụng</div>
            </div>
            <div class="stat-card c-green">
                <div class="stat-label">Hôm Nay</div>
                <div class="stat-value" id="todayGainedStat">+2,056</div>
                <div class="stat-sub">🚀 Điểm mới cày</div>
            </div>
            <div class="stat-card c-purple">
                <div class="stat-label">Tài Khoản</div>
                <div class="stat-value">8</div>
                <div class="stat-sub">👥 Đang hoạt động</div>
            </div>
            <div class="stat-card c-yellow">
                <div class="stat-label">Streak Max</div>
                <div class="stat-value">🔥 0</div>
                <div class="stat-sub">📅 Ngày duy trì</div>
            </div>
        </div>

        <!-- 1. History Grouped by Day (First) -->
        <div class="panel">
            <div class="section-header">
                <div class="section-title">📋 Lịch Sử Theo Ngày</div>
                <button class="btn-toggle-all" id="toggleAllBtn" onclick="toggleAllDays()">Mở tất cả</button>
            </div>
            <div id="historyGroupedContainer">
                <!-- Dynamic Day Cards -->
            </div>
        </div>

        <!-- 2. Compact Account Rows (Collapsed / Minimized by Default) -->
        <div class="section-header" style="cursor: pointer; user-select: none;" onclick="toggleAccounts()">
            <div class="section-title">
                <span>👤 Trạng Thái Tài Khoản (8)</span>
                <svg class="chevron" id="accChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            <button class="btn-toggle-all" id="toggleAccsBtn" onclick="event.stopPropagation(); toggleAccounts();">Mở rộng</button>
        </div>
        <div class="accounts-list" id="accountsList">
            <!-- Dynamic Compact Account Rows -->
        </div>

        <!-- 3. Chart Panel (Open by Default) -->
        <div class="panel">
            <div class="section-header" style="cursor: pointer; user-select: none; margin-bottom: 0;" onclick="toggleChart()">
                <div class="section-title">
                    <span>📈 Biểu Đồ Thống Kê Điểm</span>
                    <svg class="chevron" id="chartChevron" style="transform: rotate(180deg);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <button class="btn-toggle-all" id="toggleChartBtn" onclick="event.stopPropagation(); toggleChart();">Thu gọn</button>
            </div>
            <div class="chart-wrapper open" id="chartWrapper">
                <div class="chart-tabs">
                    <button class="chart-tab-btn active" id="tabDailyTotal" onclick="switchChartTab('daily')">🚀 Tổng Điểm Kiếm / Ngày</button>
                    <button class="chart-tab-btn" id="tabAccGrowth" onclick="switchChartTab('accounts')">👥 Tích Lũy Từng Tài Khoản</button>
                </div>
                <div class="chart-container" style="margin-top: 0.4rem;">
                    <canvas id="pointsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

            const btn = document.getElementById('toggleAccsBtn');
            const chevron = document.getElementById('accChevron');
            const isOpen = list.classList.toggle('open');
            if (btn) btn.textContent = isOpen ? 'Thu gọn' : 'Mở rộng';
            if (chevron) chevron.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function toggleAllDays() {
            const cards = document.querySelectorAll('.day-card');
            const btn = document.getElementById('toggleAllBtn');
            const anyClosed = Array.from(cards).some(c => !c.classList.contains('open'));
            
            cards.forEach(c => {
                if (anyClosed) {
                    c.classList.add('open');
                } else {
                    c.classList.remove('open');
                }
            });
            btn.textContent = anyClosed ? 'Thu gọn tất cả' : 'Mở tất cả';
        }

        function parseDateString(dStr) {
            if (!dStr) return new Date(0);
            const parts = dStr.split('/');
            if (parts.length === 3) {
                return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            }
            return new Date(dStr);
        }

        function renderDailyChart() {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }

            const canvas = document.getElementById('pointsChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // Calculate daily total gained points
            const dailyTotals = {};
            (historyData || []).forEach(item => {
                const d = item.date || (item.timestamp ? item.timestamp.split(' ')[0] : '');
                if (d) {
                    if (!dailyTotals[d]) dailyTotals[d] = 0;
                    dailyTotals[d] += (parseInt(item.gained) || 0);
                }
            });

            const sortedDates = Object.keys(dailyTotals).sort((a, b) => parseDateString(a) - parseDateString(b));
            const labels = sortedDates.slice(-10);
            const dataValues = labels.map(d => dailyTotals[d] || 0);

            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
            gradient.addColorStop(1, 'rgba(16, 185, 129, 0.01)');

            const maxVal = Math.max(...dataValues, 50);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Tổng điểm kiếm được',
                        data: dataValues,
                        borderColor: '#10b981',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        tension: 0.35,
                        fill: true,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        pointBackgroundColor: '#10b981',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        datalabels: {
                            display: true,
                            align: 'top',
                            anchor: 'end',
                            offset: 6,
                            color: '#34d399',
                            font: {
                                family: 'JetBrains Mono',
                                size: 11,
                                weight: 'bold'
                            },
                            formatter: function(value) {
                                return '+' + Number(value).toLocaleString();
                            }
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 25,
                            right: 20,
                            left: 10,
                            bottom: 5
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.92)',
                            titleFont: { family: 'Outfit', size: 12, weight: 'bold' },
                            bodyFont: { family: 'JetBrains Mono', size: 12 },
                            padding: 10,
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            displayColors: false,
                            callbacks: {
                                label: (c) => `🚀 Tổng điểm: +${Number(c.parsed.y).toLocaleString()} pts`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { color: '#94a3b8', font: { family: 'Outfit', size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { 
                                color: '#94a3b8', 
                                font: { family: 'JetBrains Mono', size: 9 },
                                callback: (v) => '+' + v
                            },
                            beginAtZero: true,
                            suggestedMax: maxVal * 1.25
                        }
                    }
                }
            });
        }

        function renderAccountsChart() {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }

            const canvas = document.getElementById('pointsChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const datesSet = new Set();
            const accDatasets = {};

            historyData.forEach(item => {
                const d = item.date || (item.timestamp ? item.timestamp.split(' ')[0] : '');
                if (!d) return;
                datesSet.add(d);
                const acc = item.account;
                if (!accDatasets[acc]) {
                    accDatasets[acc] = {};
                }
                const pts = parseInt(String(item.end_points).replace(/[,.]/g, '')) || 0;
                accDatasets[acc][d] = pts;
            });

            const labels = Array.from(datesSet).sort((a, b) => parseDateString(a) - parseDateString(b)).slice(-7);
            const colors = ['#38bdf8', '#a855f7', '#34d399', '#f59e0b', '#ec4899', '#6366f1', '#14b8a6'];

            // Build email -> account number mapping
            const emailToNum = accNumMap;
            
            const datasets = Object.keys(accDatasets).map((acc, index) => {
                const color = colors[index % colors.length];
                const data = labels.map(d => accDatasets[acc][d] || null);
                const accUser = acc.split('@')[0];
                const accNum = emailToNum[acc] || emailToNum[accUser] || (index + 1);
                const shortLabel = accUser + ' #' + accNum;
                return {
                    label: shortLabel,
                    data: data,
                    borderColor: color,
                    backgroundColor: color + '15',
                    borderWidth: 2,
                    tension: 0.35,
                    fill: false,
                    pointRadius: 3,
                    pointHoverRadius: 5,
                    datalabels: {
                        display: function(ctx) {
                            // Chi hien thi o diem cuoi cung co data
                            const arr = ctx.dataset.data;
                            let lastIdx = -1;
                            for (let i = arr.length - 1; i >= 0; i--) {
                                if (arr[i] !== null && arr[i] !== undefined) { lastIdx = i; break; }
                            }
                            return ctx.dataIndex === lastIdx;
                        },
                        align: 'right',
                        anchor: 'end',
                        offset: 6,
                        color: color,
                        font: {
                            family: 'JetBrains Mono',
                            size: 10,
                            weight: 'bold'
                        },
                        formatter: function(value, ctx) {
                            return '#' + accNum;
                        }
                    }
                };
            });

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            right: 45
                        }
                    },
                    plugins: {
                        datalabels: {
                            display: true
                        },
                        legend: {
                            position: 'bottom',
                            labels: { 
                                color: '#94a3b8', 
                                boxWidth: 8,
                                padding: 6,
                                font: { family: 'Outfit', size: 10 } 
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { color: '#94a3b8', font: { family: 'Outfit', size: 9 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.04)' },
                            ticks: { color: '#94a3b8', font: { family: 'Outfit', size: 9 } }
                        }
                    }
                }
            });
        }

        function switchChartTab(tab) {
            currentChartTab = tab;
            const tabDaily = document.getElementById('tabDailyTotal');
            const tabAcc = document.getElementById('tabAccGrowth');
            if (tab === 'daily') {
                if (tabDaily) tabDaily.classList.add('active');
                if (tabAcc) tabAcc.classList.remove('active');
                renderDailyChart();
            } else {
                if (tabDaily) tabDaily.classList.remove('active');
                if (tabAcc) tabAcc.classList.add('active');
                renderAccountsChart();
            }
        }

        // Initialize daily total chart on load
        renderDailyChart();
    </script>
</body>
</html>
